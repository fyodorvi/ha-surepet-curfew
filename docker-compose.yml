services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-surepet-curfew
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      TZ: Pacific/Auckland
    volumes:
      - ./ha-config:/config
      - ./custom_components:/config/custom_components
